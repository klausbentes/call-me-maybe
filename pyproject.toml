[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Foundation layer for the 42 Call Me Maybe project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = '^(llm_sdk|\.venv|\.mypy_cache|\.uv-cache|\.hf-cache)/'
